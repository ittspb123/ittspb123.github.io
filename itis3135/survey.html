<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Precious Bikusa's Patient Beaver | ITIS3135 | Workshop Survey</title>

  <link rel="stylesheet" href="styles/default.css">
  <link rel="icon" type="image/png" href="images/patient_beaver.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap"
    rel="stylesheet"
  >

  <script
    src="https://lint.page/kit/4d0fe3.js"
    crossorigin="anonymous"
  ></script>
</head>

<body>
  <div data-include="components/header.html"></div>

  <main>
    <h2>Workshop Survey</h2>
    <!--
  The survey-form ID lets JavaScript handle submission and reset.
  Input IDs connect each field to its label.
  The survey-status ID identifies the feedback message.
  The choice class aligns radio buttons and checkboxes with their labels.
  The survey-note ID connects the instructions to the form.
-->

  <form id="survey-form" aria-describedby="survey-note">
  <p id="survey-note">
    Help Patient Beaver Workshop design desk accessories for your
    study space.
  </p>

  <fieldset>
    <legend>Introduce Yourself</legend>

    <label for="first-name">First name (required)</label>
    <input
      id="first-name"
      name="first-name"
      type="text"
      autocomplete="given-name"
      required
    >

        <label for="last-name">Last name (required)</label>
        <input
          id="last-name"
          name="last-name"
          type="text"
          autocomplete="family-name"
          required
        >

        <label for="email">Email (required)</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        >

        <label for="mascot">Your mascot or nickname</label>
        <input id="mascot" name="mascot" type="text">
      </fieldset>

      <fieldset>
        <legend>Your Study Space</legend>

        <label for="hours">Daily study hours (0–24)</label>
        <input
          id="hours"
          name="hours"
          type="number"
          min="0"
          max="24"
          step="0.5"
        >

        <label for="favorite">Which accessory interests you most?</label>
        <select id="favorite" name="favorite">
          <option value="">Choose an accessory</option>
          <option value="stand">Laptop stand</option>
          <option value="organizer">Cable organizer</option>
          <option value="bookends">Bookends</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Preferred Finish</legend>

        <label class="choice">
          <input type="radio" name="finish" value="natural" checked>
          Natural wood
        </label>

        <label class="choice">
          <input type="radio" name="finish" value="dark">
          Dark wood
        </label>
      </fieldset>

      <fieldset>
        <legend>What Matters to You?</legend>

        <label class="choice">
          <input type="checkbox" name="features" value="compact">
          Compact size
        </label>

        <label class="choice">
          <input type="checkbox" name="features" value="storage">
          Extra storage
        </label>

        <label class="choice">
          <input type="checkbox" name="features" value="custom">
          Custom design
        </label>

        <label for="comments">What would improve your desk?</label>
        <textarea
          id="comments"
          name="comments"
          rows="4"
        ></textarea>
      </fieldset>

      <button type="submit">Check My Survey</button>
      <button type="reset">Clear Answers</button>

      <p id="survey-status" role="status"></p>
    </form>
  </main>

  <div data-include="components/footer.html"></div>

  <script src="scripts/include.min.js"></script>
  <script src="scripts/survey.js"></script>
  <script
    src="https://divonbriesen.github.io/teaching/tools/standards-check.js"
    defer
  ></script>
</body>
</html>
